# Zyverse edge — the only container published on 80/443.
# Serves the SPA and reverse-proxies /api + /uploads to the backend container.

upstream backend {
    server backend:5050;
    keepalive 16;
}

# ── HTTP :80 — ACME challenges + redirect everything else to HTTPS ──
server {
    listen 80;
    listen [::]:80;
    server_name _;

    # Let's Encrypt webroot challenge (see certbot service)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS :443 — the app ──
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:5m;
    ssl_session_timeout 1h;

    root  /usr/share/nginx/html;
    index index.html;

    # multer caps uploads at 10 MB — give a little headroom, reject the rest here
    client_max_body_size 12M;

    # gzip text assets on the fly
    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_types        text/plain text/css application/javascript application/json
                      image/svg+xml application/wasm;

    # Content-hashed build assets — cache hard
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Static models / textures / fonts / media
    location ~* \.(glb|gltf|ktx2|basis|woff2?|mp3|png|jpe?g|webp|svg|wasm)$ {
        expires 30d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # ── API ──
    location /api/ {
        proxy_pass         http://backend;
        proxy_http_version 1.1;
        proxy_set_header   Connection "";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # ── Uploaded files (served by the backend from its volume) ──
    location /uploads/ {
        proxy_pass       http://backend;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 7d;
        add_header Cache-Control "public";
    }

    # ── SPA fallback ──
    location / {
        try_files $uri $uri/ /index.html;
    }
}
