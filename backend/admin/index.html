<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, nofollow" />
<title>Zyverse Admin</title>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
  :root {
    --bg: #0d0b07; --panel: #16130d; --line: rgba(201,168,76,.22);
    --gold: #c9a84c; --cream: #f7eed7; --ember: #e05e26;
    --muted: rgba(247,238,215,.6);
    --ui: "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--cream); font-family: var(--ui); font-size: 14px; }
  a { color: var(--gold); }
  header {
    display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
    padding: 16px 24px; border-bottom: 1px solid var(--line); position: sticky; top: 0;
    background: var(--bg); z-index: 5;
  }
  header h1 { font-size: 16px; letter-spacing: 2px; text-transform: uppercase; margin: 0; color: var(--gold); }
  header .who { margin-left: auto; color: var(--muted); font-size: 13px; }
  button {
    font-family: var(--ui); cursor: pointer; border-radius: 6px; border: 1px solid var(--line);
    background: rgba(201,168,76,.08); color: var(--cream); padding: 7px 14px; font-size: 13px;
  }
  button:hover { background: rgba(201,168,76,.18); }
  button.primary { background: linear-gradient(90deg, var(--gold), var(--ember)); color: #1a1509; border-color: transparent; font-weight: 600; }
  button:disabled { opacity: .5; cursor: default; }
  .wrap { padding: 24px; max-width: 1200px; margin: 0 auto; }
  .tabs { display: flex; gap: 8px; margin-bottom: 20px; flex-wrap: wrap; }
  .tabs button.active { background: rgba(201,168,76,.22); border-color: var(--gold); }
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 24px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 16px; }
  .card .n { font-size: 26px; color: var(--gold); font-weight: 700; }
  .card .l { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; margin-top: 4px; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { color: var(--muted); font-weight: 600; text-transform: uppercase; font-size: 11px; letter-spacing: .5px; }
  tr:hover td { background: rgba(255,255,255,.02); }
  .thumb { width: 46px; height: 46px; object-fit: cover; border-radius: 6px; border: 1px solid var(--line); display: block; }
  .badge { display: inline-block; font-size: 11px; text-transform: uppercase; letter-spacing: .5px; padding: 3px 9px; border-radius: 999px; border: 1px solid var(--line); }
  .badge.pending { color: #f0c860; border-color: rgba(224,176,44,.5); }
  .badge.approved { color: #8fe3b0; border-color: rgba(91,208,138,.5); }
  .badge.rejected { color: #ff9d7a; border-color: rgba(224,94,38,.5); }
  .row-actions { display: flex; gap: 6px; margin-top: 6px; }
  .row-actions button { padding: 4px 10px; font-size: 12px; }
  .muted { color: var(--muted); }
  .team { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 16px; margin-bottom: 12px; position: relative; }
  .team h3 { margin: 0 0 4px; font-size: 15px; }
  .team code { background: rgba(201,168,76,.12); padding: 2px 8px; border-radius: 5px; letter-spacing: 2px; }
  .center { min-height: 70vh; display: grid; place-items: center; text-align: center; }
  .center .box { max-width: 360px; }
  #err { color: #ff9d7a; margin-top: 12px; }
  .search { padding: 8px 12px; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; color: var(--cream); font-family: var(--ui); margin-bottom: 14px; width: 260px; max-width: 100%; }
  .toolbar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 14px; }

  /* Danger button */
  button.danger {
    background: rgba(224,94,38,.12); border-color: rgba(224,94,38,.4); color: #ff9d7a;
  }
  button.danger:hover { background: rgba(224,94,38,.28); border-color: var(--ember); color: #fff; }

  /* Confirmation modal overlay */
  .modal-overlay {
    position: fixed; inset: 0; z-index: 100;
    background: rgba(0,0,0,.65); backdrop-filter: blur(4px);
    display: grid; place-items: center;
    opacity: 0; pointer-events: none;
    transition: opacity .2s ease;
  }
  .modal-overlay.open { opacity: 1; pointer-events: auto; }
  .modal-box {
    background: var(--panel); border: 1px solid var(--line); border-radius: 14px;
    padding: 28px 32px; max-width: 440px; width: 90%;
    box-shadow: 0 12px 40px rgba(0,0,0,.5);
    transform: translateY(12px) scale(.97); transition: transform .2s ease;
  }
  .modal-overlay.open .modal-box { transform: translateY(0) scale(1); }
  .modal-box .modal-icon { font-size: 32px; margin-bottom: 8px; }
  .modal-box h2 { margin: 0 0 8px; font-size: 17px; color: var(--cream); }
  .modal-box p { color: var(--muted); font-size: 13px; line-height: 1.55; margin: 0 0 20px; }
  .modal-box p strong { color: var(--cream); }
  .modal-actions { display: flex; gap: 10px; justify-content: flex-end; }
  .modal-actions button.confirm-danger {
    background: linear-gradient(90deg, #c0392b, var(--ember)); color: #fff;
    border-color: transparent; font-weight: 600;
  }
  .modal-actions button.confirm-danger:hover { filter: brightness(1.1); }

  /* Toast notification */
  .toast-container {
    position: fixed; top: 20px; right: 20px; z-index: 200;
    display: flex; flex-direction: column; gap: 8px; pointer-events: none;
  }
  .toast {
    pointer-events: auto;
    background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
    padding: 14px 20px; font-size: 13px; color: var(--cream);
    box-shadow: 0 8px 24px rgba(0,0,0,.4);
    display: flex; align-items: center; gap: 10px;
    transform: translateX(120%); transition: transform .3s cubic-bezier(.22,1,.36,1);
    max-width: 380px;
  }
  .toast.show { transform: translateX(0); }
  .toast.success { border-left: 3px solid #8fe3b0; }
  .toast.error { border-left: 3px solid #ff9d7a; }
  .toast .toast-icon { font-size: 18px; flex-shrink: 0; }
  .toast .toast-msg { flex: 1; }
</style>
</head>
<body>

<!-- Confirmation Modal -->
<div class="modal-overlay" id="confirmModal">
  <div class="modal-box">
    <div class="modal-icon" id="modalIcon">⚠️</div>
    <h2 id="modalTitle">Confirm Action</h2>
    <p id="modalMsg">Are you sure?</p>
    <div class="modal-actions">
      <button id="modalCancel">Cancel</button>
      <button class="confirm-danger" id="modalConfirm">Delete</button>
    </div>
  </div>
</div>

<!-- Toast Container -->
<div class="toast-container" id="toasts"></div>

<div id="login" class="center">
  <div class="box">
    <h1 style="color:var(--gold);letter-spacing:3px;">ZYVERSE ADMIN</h1>
    <p class="muted">Sign in with an authorised organiser account.</p>
    <div id="gbtn" style="display:flex;justify-content:center;margin-top:16px;"></div>
    <p id="err"></p>
  </div>
</div>

<div id="app" style="display:none;">
  <header>
    <h1>Zyverse Admin</h1>
    <span class="who" id="who"></span>
    <button id="refresh">Refresh</button>
    <button id="logout">Sign out</button>
  </header>
  <div class="wrap">
    <div class="tabs">
      <button data-tab="overview" class="active">Overview</button>
      <button data-tab="registrations">Registrations</button>
      <button data-tab="users">Users</button>
      <button data-tab="teams">Teams</button>
    </div>
    <div id="view"></div>
  </div>
</div>

<script>
const CLIENT_ID = "__GOOGLE_CLIENT_ID__";
const TOKEN_KEY = "zyverse_token";
let token = null;
try { token = localStorage.getItem(TOKEN_KEY); } catch {}
let cache = {};
let currentTab = "overview";

const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c]));

async function api(path, opts = {}) {
  const res = await fetch("/api" + path, {
    ...opts,
    headers: { "Content-Type": "application/json", Authorization: "Bearer " + token, ...(opts.headers || {}) },
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || ("HTTP " + res.status));
  return data;
}

/* ---- auth ---- */
function initGoogle() {
  if (!window.google?.accounts?.id) return setTimeout(initGoogle, 150);
  google.accounts.id.initialize({
    client_id: CLIENT_ID,
    callback: async (resp) => {
      $("#err").textContent = "";
      try {
        const r = await fetch("/api/auth/google", {
          method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ credential: resp.credential }),
        });
        const d = await r.json();
        if (!r.ok) throw new Error(d.error || "Login failed");
        token = d.token;
        try { localStorage.setItem(TOKEN_KEY, token); } catch {}
        boot();
      } catch (e) { $("#err").textContent = e.message; }
    },
  });
  google.accounts.id.renderButton($("#gbtn"), { theme: "filled_black", size: "large", shape: "pill", text: "signin_with" });
}

async function boot() {
  if (!token) { showLogin(); return; }
  try {
    const me = await api("/admin/whoami");
    $("#who").textContent = (me.name || me.email) + " · admin";
    $("#login").style.display = "none";
    $("#app").style.display = "";
    await loadAll();
    render();
  } catch (e) {
    if (String(e.message).toLowerCase().includes("admin access")) {
      showLogin("That account is not an authorised admin.");
    } else {
      token = null; try { localStorage.removeItem(TOKEN_KEY); } catch {}
      showLogin(e.message);
    }
  }
}

function showLogin(msg) {
  $("#app").style.display = "none";
  $("#login").style.display = "grid";
  $("#err").textContent = msg || "";
  initGoogle();
}

/* ---- data ---- */
async function loadAll() {
  const [summary, registrations, users, teams] = await Promise.all([
    api("/admin/summary"), api("/admin/registrations"), api("/admin/users"), api("/admin/teams"),
  ]);
  cache = { summary, registrations: registrations.registrations, users: users.users, teams: teams.teams };
}

/* ---- render ---- */
function render() {
  document.querySelectorAll(".tabs button").forEach((b) => b.classList.toggle("active", b.dataset.tab === currentTab));
  const v = $("#view");
  if (currentTab === "overview") v.innerHTML = viewOverview();
  if (currentTab === "registrations") v.innerHTML = viewRegistrations();
  if (currentTab === "users") v.innerHTML = viewUsers();
  if (currentTab === "teams") v.innerHTML = viewTeams();
  wireView();
}

function viewOverview() {
  const s = cache.summary;
  const st = s.registrationsByStatus;
  return `
    <div class="cards">
      <div class="card"><div class="n">${s.users}</div><div class="l">Users</div></div>
      <div class="card"><div class="n">${s.onboarded}</div><div class="l">Onboarded</div></div>
      <div class="card"><div class="n">${s.registrations}</div><div class="l">Registrations</div></div>
      <div class="card"><div class="n">${s.soloRegistrations ?? 0}</div><div class="l">Solo</div></div>
      <div class="card"><div class="n">${s.teamRegistrations ?? 0}</div><div class="l">Team</div></div>
      <div class="card"><div class="n">${st.pending}</div><div class="l">Pending</div></div>
      <div class="card"><div class="n">${st.approved}</div><div class="l">Approved</div></div>
      <div class="card"><div class="n">${st.rejected}</div><div class="l">Rejected</div></div>
      <div class="card"><div class="n">${s.participants ?? 0} / ${s.totalCapacity ?? 76}</div><div class="l">Participants</div></div>
    </div>
    <h3>Fill by event</h3>
    <table><thead><tr><th>Event</th><th>Registrations</th><th>Participants</th><th>Capacity</th><th>Left</th></tr></thead><tbody>
      ${s.registrationsByEvent.map((e) => `<tr>
        <td>${esc(e.eventName)}</td>
        <td>${e.count}</td>
        <td>${e.participants ?? "—"}</td>
        <td>${e.capacity ?? "—"}</td>
        <td>${e.isFull ? `<span class="badge rejected">FULL</span>` : (e.spotsLeft ?? "—")}</td>
      </tr>`).join("")}
    </tbody></table>`;
}

function imgCell(url, label) {
  if (!url) return `<span class="muted">—</span>`;
  return `<a href="${esc(url)}" target="_blank" rel="noopener" title="${esc(label)}"><img class="thumb" src="${esc(url)}" alt="${esc(label)}"></a>`;
}

function viewRegistrations() {
  const rows = cache.registrations;
  return `
    <div class="toolbar">
      <input class="search" id="rsearch" placeholder="Filter by name / email / event…">
      <span class="muted">${rows.length} total</span>
    </div>
    <table><thead><tr>
      <th>Participant</th><th>Event</th><th>Mode / teammate</th><th>Reference ID</th><th>Payment</th><th>ID cards</th><th>Status</th>
    </tr></thead><tbody id="rbody">
      ${rows.map(regRow).join("")}
    </tbody></table>`;
}
function regRow(r) {
  const u = r.user;
  const tm = r.teammate;
  const search = [u.firstName, u.lastName, u.email, u.college, r.event.name, r.transactionId,
    tm && tm.firstName, tm && tm.lastName, tm && tm.email, tm && tm.college].filter(Boolean).join(" ").toLowerCase();
  return `<tr data-search="${esc(search)}">
    <td>
      <strong>${esc(u.firstName)} ${esc(u.lastName)}</strong><br>
      <span class="muted">${esc(u.email)}</span><br>
      <span class="muted">${esc(u.phoneNumber || "no phone")}</span><br>
      <span class="muted">${esc(u.college || "no college")}</span>
    </td>
    <td>${esc(r.event.name)}</td>
    <td>${r.mode === "team" && tm
      ? `<strong>team</strong><br>${esc(tm.firstName)} ${esc(tm.lastName)}<br><span class="muted">${esc(tm.email)} · ${esc(tm.phoneNumber || "no phone")}</span><br><span class="muted">${esc(tm.college || "no college")}</span>`
      : `<span class="muted">solo</span>`}</td>
    <td>${r.transactionId ? `<code>${esc(r.transactionId)}</code>` : `<span class="muted">—</span>`}</td>
    <td>${imgCell(r.paymentScreenshotUrl, "payment")}</td>
    <td>${imgCell(u.idCardUrl, "id card")}${tm ? " " + imgCell(tm.idCardUrl, "teammate id card") : ""}</td>
    <td>
      <span class="badge ${r.status}">${r.status}</span>
      <div class="row-actions">
        <button data-approve="${r.id}" ${r.status === "approved" ? "disabled" : ""}>Approve</button>
        <button data-reject="${r.id}" ${r.status === "rejected" ? "disabled" : ""}>Reject</button>
      </div>
    </td>
  </tr>`;
}

function viewUsers() {
  const rows = cache.users;
  return `
    <div class="toolbar">
      <input class="search" id="usearch" placeholder="Filter by name / email…">
      <span class="muted">${rows.length} total</span>
    </div>
    <table><thead><tr>
      <th></th><th>Name</th><th>Contact</th><th>Onboarded</th><th>Mode</th><th>ID card</th><th>Event</th><th>Teammate</th><th>Joined</th><th>Actions</th>
    </tr></thead><tbody id="ubody">
      ${rows.map(userRow).join("")}
    </tbody></table>`;
}
function userRow(u) {
  const tm = u.teammate;
  return `<tr data-search="${esc((u.firstName+" "+u.lastName+" "+u.email+" "+(u.college||"")+" "+(tm ? tm.firstName+" "+tm.lastName+" "+tm.email+" "+(tm.college||"") : "")).toLowerCase())}">
    <td>${imgCell(u.profilePicUrl, "profile")}</td>
    <td><strong>${esc(u.firstName || "")} ${esc(u.lastName || "")}</strong></td>
    <td>${esc(u.email)}<br><span class="muted">${esc(u.phoneNumber || "—")}</span><br><span class="muted">${esc(u.college || "—")}</span></td>
    <td>${u.isOnboarded ? "✓" : `<span class="muted">no</span>`}</td>
    <td>${u.mode ? esc(u.mode) : `<span class="muted">—</span>`}</td>
    <td>${imgCell(u.idCardUrl, "id card")}</td>
    <td>${u.registration ? esc(u.registration.eventName) + `<br><span class="badge ${u.registration.status}">${u.registration.status}</span>` : `<span class="muted">—</span>`}</td>
    <td>${tm ? esc(tm.firstName + " " + tm.lastName) + `<br><span class="muted">${esc(tm.email)}</span><br><span class="muted">${esc(tm.college || "—")}</span>` : `<span class="muted">—</span>`}</td>
    <td class="muted">${esc((u.createdAt || "").slice(0, 10))}</td>
    <td><button class="danger" data-delete-user="${u.id}" data-delete-name="${esc([u.firstName, u.lastName].filter(Boolean).join(" "))}" data-delete-email="${esc(u.email)}">Delete</button></td>
  </tr>`;
}

function viewTeams() {
  const rows = cache.teams;
  return `<div class="toolbar"><span class="muted">${rows.length} teams</span></div>` + (rows.map((t) => `
    <div class="team">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:12px;">
        <div>
          <h3>${esc(t.name)}</h3>
          <div class="muted">${esc(t.event.name)}${t.registrationStatus ? ` · <span class="badge ${t.registrationStatus}">${t.registrationStatus}</span>` : ""} · created ${esc((t.createdAt||"").slice(0,10))}</div>
        </div>
        <button class="danger" data-delete-team="${t.id}" data-team-name="${esc(t.name)}" data-team-event="${esc(t.event.name)}">Remove Team</button>
      </div>
      <table style="margin-top:10px;"><thead><tr><th>Member</th><th>Email</th><th>Phone</th><th>College</th><th>Role</th><th>ID card</th></tr></thead><tbody>
        ${t.members.map((m) => `<tr>
          <td>${esc(m.firstName || "")} ${esc(m.lastName || "")}</td>
          <td>${esc(m.email || "—")}</td>
          <td>${esc(m.phoneNumber || "—")}</td>
          <td>${esc(m.college || "—")}</td>
          <td>${m.isLeader ? "registrar" : "teammate"}</td>
          <td>${imgCell(m.idCardUrl, "id card")}</td>
        </tr>`).join("")}
      </tbody></table>
    </div>`).join("") || `<p class="muted">No teams yet.</p>`);
}

function wireView() {
  const filter = (inputId, bodyId) => {
    const input = document.getElementById(inputId);
    if (!input) return;
    input.addEventListener("input", () => {
      const q = input.value.toLowerCase().trim();
      document.querySelectorAll("#" + bodyId + " tr").forEach((tr) => {
        tr.style.display = !q || (tr.dataset.search || "").includes(q) ? "" : "none";
      });
    });
  };
  filter("rsearch", "rbody");
  filter("usearch", "ubody");

  document.querySelectorAll("[data-approve]").forEach((b) =>
    b.addEventListener("click", () => setStatus(b.dataset.approve, "approved")));
  document.querySelectorAll("[data-reject]").forEach((b) =>
    b.addEventListener("click", () => setStatus(b.dataset.reject, "rejected")));

  // Delete user buttons
  document.querySelectorAll("[data-delete-user]").forEach((b) =>
    b.addEventListener("click", () => {
      const id = b.dataset.deleteUser;
      const name = b.dataset.deleteName;
      const email = b.dataset.deleteEmail;
      showConfirmModal({
        icon: "🗑️",
        title: "Delete User Account",
        // A user who signed in but never onboarded has no name yet — identify them by email alone.
        message: `Delete user ${name ? `<strong>${esc(name)}</strong> (${esc(email)})` : `<strong>${esc(email)}</strong>`}? This will permanently remove their account, registrations, and team data.<br><br>This action <strong>cannot be undone</strong>.`,
        confirmText: "Delete User",
        onConfirm: () => deleteUser(id),
      });
    }));

  // Remove team buttons
  document.querySelectorAll("[data-delete-team]").forEach((b) =>
    b.addEventListener("click", () => {
      const userId = b.dataset.deleteTeam;
      const teamName = b.dataset.teamName;
      const eventName = b.dataset.teamEvent;
      showConfirmModal({
        icon: "⚠️",
        title: "Remove Team",
        message: `Remove team <strong>${esc(teamName)}</strong> from <strong>${esc(eventName)}</strong>?<br><br>This will delete the teammate record and cancel their registration. The registrar's account will remain but will need to re-onboard.`,
        confirmText: "Remove Team",
        onConfirm: () => deleteTeam(userId),
      });
    }));
}

async function setStatus(id, status) {
  try {
    await api("/admin/registrations/" + id, { method: "PATCH", body: JSON.stringify({ status }) });
    const reg = cache.registrations.find((r) => String(r.id) === String(id));
    if (reg) reg.status = status;
    cache.summary = await api("/admin/summary");
    render();
  } catch (e) { alert(e.message); }
}

/* ---- delete user ---- */
async function deleteUser(id) {
  try {
    const res = await api("/admin/users/" + id, { method: "DELETE" });
    showToast("success", `User ${res.deleted.name || res.deleted.email} deleted successfully.`);
    await loadAll();
    render();
  } catch (e) {
    showToast("error", e.message);
  }
}

/* ---- delete team ---- */
async function deleteTeam(userId) {
  try {
    const res = await api("/admin/teams/" + userId, { method: "DELETE" });
    showToast("success", `Team removed. ${res.deleted.teammateName} unlinked from ${res.deleted.registrarEmail}.`);
    await loadAll();
    render();
  } catch (e) {
    showToast("error", e.message);
  }
}

/* ---- confirm modal ---- */
let _modalResolve = null;
function showConfirmModal({ icon, title, message, confirmText, onConfirm }) {
  $("#modalIcon").textContent = icon || "⚠️";
  $("#modalTitle").textContent = title || "Confirm";
  $("#modalMsg").innerHTML = message || "Are you sure?";
  $("#modalConfirm").textContent = confirmText || "Confirm";
  $("#confirmModal").classList.add("open");

  // Clean up old listeners by cloning
  const oldConfirm = $("#modalConfirm");
  const newConfirm = oldConfirm.cloneNode(true);
  oldConfirm.parentNode.replaceChild(newConfirm, oldConfirm);

  const oldCancel = $("#modalCancel");
  const newCancel = oldCancel.cloneNode(true);
  oldCancel.parentNode.replaceChild(newCancel, oldCancel);

  const close = () => $("#confirmModal").classList.remove("open");

  newCancel.addEventListener("click", close);
  newConfirm.addEventListener("click", () => {
    close();
    onConfirm();
  });

  // Close on overlay click
  $("#confirmModal").onclick = (e) => { if (e.target === $("#confirmModal")) close(); };
}

/* ---- toast ---- */
function showToast(type, msg) {
  const container = $("#toasts");
  const toast = document.createElement("div");
  toast.className = `toast ${type}`;
  // msg carries server-echoed names typed by participants — set it as text, never HTML.
  toast.innerHTML = `<span class="toast-icon">${type === "success" ? "✅" : "❌"}</span><span class="toast-msg"></span>`;
  toast.querySelector(".toast-msg").textContent = msg;
  container.appendChild(toast);
  requestAnimationFrame(() => requestAnimationFrame(() => toast.classList.add("show")));
  setTimeout(() => {
    toast.classList.remove("show");
    setTimeout(() => toast.remove(), 350);
  }, 3500);
}

/* ---- events ---- */
document.querySelectorAll(".tabs button").forEach((b) =>
  b.addEventListener("click", () => { currentTab = b.dataset.tab; render(); }));
$("#refresh").addEventListener("click", async () => { await loadAll(); render(); });
$("#logout").addEventListener("click", () => {
  token = null; try { localStorage.removeItem(TOKEN_KEY); } catch {}
  cache = {}; showLogin();
});

boot();
</script>
